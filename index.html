 is\n    crowded with many cars. D. A pedestrian is crossing the street.\n\n5.  Look at the picture marked number 5 in your textbook. A. The woman\n    is leaning against the wall. B. There are some documents on the\n    desk. C. The woman is drinking a bottle of water. D. The woman is\n    writing something down on the board.\n\n6.  Look at the picture marked number 6 in your textbook. A. They are\n    taking the items down. [uncertain] B. They are shopping for\n    clothes. C. They are riding on an escalator. D. They are across from\n    each other.\n\nGo on to the next page.\n\n7.  Look at the picture marked number 7 in your textbook. A. Various\n    pictures are being displayed on the shelves. B. The chicken is\n    standing in a room. [uncertain] C. There is a book under the chair.\n    [uncertain] D. There is an information board behind the light.\n    [uncertain]\n\n8.  Look at the picture marked number 8 in your textbook. A. The woman\n    is walking down the aisle. B. The woman is mopping the floor. C. The\n    woman is reaching for an item. D. Some frozen foods need to be\n    stocked.\n\n9.  Look at the picture marked number 9 in your textbook. A. All of the\n    people are walking in the same direction. B. One of the men is\n    taking off his glasses. C. There are trees growing along the\n    road. D. They are running in a line.\n\n10. Look at the picture marked number 10 in your textbook. A. The boat\n    is returning from sailing. B. Some people are swimming at the\n    beach. C. The people are taking a cruise. D. The buildings overlook\n    the water.\n\nPART 2 — DIRECTIONS You will hear a question or statement and three\nresponses spoken in English. They will be spoken only one time and will\nnot be printed in your textbook. Select the best response and mark A, B,\nor C on your answer sheet.\n\nExample: “How will I open an account?” A. It opens at around eight. B.\nJust fill out this form. C. You can count on me. The best response is B,\n“Just fill out this form.”\n\n11. Where should I put all these papers? A. On the shelves over\n    there. B. Listen to the cabinet. [uncertain] C. [unclear]\n\n12. Why is the traffic so heavy here? A. They’re paving the road\n    ahead. B. You turned left at the red light. C. I’d like something\n    light.\n\n13. Did you buy new curtains last weekend? A. There are many selections\n    to choose from. B. No, I didn’t have time. C. I bought some new\n    shoes today.\n\n14. Would you like …? [question incomplete in supplied transcript] A.\n    It’s nice outside. B. I don’t enjoy outdoor activities. C. Please\n    have a seat.\n\n15. Could you return my call before 3 p.m.? A. Sure, I’ll call you\n    around 2:30. B. No, she hasn’t returned yet. C. No, I think it’s 4\n    p.m.\n\n16. When is the deadline for the final draft? [Responses not captured in\n    supplied transcript.]\n\n17. She’s the new … in the sales department, right? [job title\n    unclear] A. The sale will go on until this weekend. B. They are\n    hiring interns now. C. No, in the marketing department.\n\n18. Which company do you think I should buy …? [ending unclear] A. We\n    have to move everything out. B. The one with blue stripes. C.\n    [unclear]\n\n19. Hasn’t it stopped snowing yet? A. No, it’s not coming now.\n    [uncertain] B. Yes, it has. C. It started this morning.\n\n20. Take a right after two lights. A. You have the right of silence. B.\n    Thanks for the directions. C. It takes half an hour by car.\n\n21. How will you get to the party tonight? A. Mike is giving me a\n    ride. B. She is a bus driver. C. That was a pretty big party.\n\n22. Do you want to eat dinner at home or eat out today? A. I need some\n    flowers to put on the table. B. Why don’t we order something since\n    it’s raining? C. The dining room is full of antique furniture.\n\n23. Who’s going to come and see the computer hardware? A. [unclear] B.\n    The tech support team will send someone. C. This software doesn’t\n    work on my computer.\n\n24. Why is the coffee shop closed today? A. I’ll make copies of them.\n    [uncertain] B. Yes, the shop is close to us. C. They are renovating\n    until next week.\n\n25. Have the supplies I ordered arrived yet? A. That live show was worth\n    watching. B. Yes, they are on your desk. C. They are placed in\n    alphabetical order.\n\n26. What was the topic of the speech Mr. Bennett gave? A. It will be\n    held at the Grand Ballroom. B. I wish I knew. C. Yes, Mr. Bennett is\n    a great speaker.\n\n27. I’m calling to change my destination from … to Busan. [origin\n    unclear] A. I’m sorry, I didn’t have any change. B. [unclear] C.\n    What is your reservation number?\n\n28. Who should I tell if I need to take a day off? A. Ask your\n    supervisor first. B. The plane is taking off soon. C. Welcome back.\n\n29. Nick, do you commute to work with anyone? A. I shouldn’t have pulled\n    my car out. B. My neck has been hurting recently. C. [unclear]\n\n30. What time does the bus run? A. It should be here any minute. B. I go\n    there once a week. C. The bus is usually full this time of the day.\n\n31. Can I have another copy of this contract? A. Sure, let me make more\n    copies. B. Sam’s trying to contact you last night. [uncertain] C. No\n    problem. I’ll bring it right away.\n\n32. Where is the grocery store? A. We are running out of milk. B. I go\n    shopping about once a month. C. It’s right across from the post\n    office.\n\n33. Mr. Jones will be busy if we win the contract. A. I think we all\n    will be. B. Did you know we won the game? C. I was busy preparing\n    for the test.\n\n34. How long would it take to get to the factory? A. Half an hour at\n    most. B. Since three years ago. C. You have to understand the facts.\n\n35. Could you pick a muffin for me while you’re at the coffee shop? A.\n    Sure. Anything else? B. I’d like a strong cup of coffee. C. Thank\n    you very much.\n\n36. Do you know a shortcut to the headquarters? A. supervisor know what you want, at\nleast. Good luck.” 44. What are the speakers talking about? 45. What is\nJeremy going to be doing in Paris? 46. Who is the woman most likely to\nbe?\n\nQuestions 47–49: “Excuse me. I can’t remember what it’s called, but I’m\nlooking for a kind of hard candy that’s supposed to relieve a sore\nthroat. Do you carry it?” “There are many, but I’m not sure exactly what\nyou’re looking for. All our hard candies are in A3. There were some\nherbal throat drops in breath mints by the register as you check out,\nbut it sounds like what you’re talking about isn’t a breath mint or a\nregular hard candy.” “It came out pretty recently. If you’re coming down\nwith a cold and you take it, it keeps it away. And if you have a cold,\nit’s supposed to make it go away. I saw your ad on TV the other day. A\nbig man with a red coat was in the ad.” “Oh, that’s called [product name\nunclear]. We’ve got it in lemon and cherry, in aisle 5 next to the\naspirin.” 47. What is the situation? 48. Where did they keep the herbal\nthroat drops? 49. What flavors do they carry?\n\n========================================================================", "oldChinese": "========================================================================\n\n第一部分：听力测试介绍\n在听力测试中，你需要展示自己理解英语口语的能力。整个听力测试大约持续45分钟，共有四个部分，每个部分都有相应的说明。你必须将答案标记在单独的答题卡上。不要把答案写在课本上。\n\n第一部分：题目说明\n本部分的每道题，你都会听到四个关于课本中一幅图片的陈述。听到这些陈述后，请选出最准确描述图片内容的一项。然后在答题卡上找到对应题号并标记答案。这些陈述不会印在课本上，而且只会播放一遍。\n\n例题： A. 赛跑者正走上跑道。 B. 这些年轻女性正在参加赛跑。 C.\n她们准备休息一下。 D. 她们正在吃米饭。\nB项“这些年轻女性正在参加赛跑”是对图片最准确的描述。因此，选择B并在答题卡上标记答案。\n\n现在开始第一部分。\n\n1.  看课本中标记为第1题的图片。 A. 男士正在写信。 B.\n    男士坐在报摊旁边。 C. 男士正在浏览报纸。 D. 男士正在编辑报纸。\n\n2.  看课本中标记为第2题的图片。 A. 床铺已经整理好了。 B.\n    窗帘挡住了窗户。 C. 每张床的上方都挂着一幅画。 D.\n    两张床之间曾经有一盏灯。\n\n请翻到下一页。\n\n3.  看课本中标记为第3题的图片。 A. 人们正在排队。 B.\n    商品被摆放在地板上。 C. 一位女士正在穿围裙。 D. 一位女士正在问路。\n\n4.  看课本中标记为第4题的图片。 A. 公共汽车已经驶离道路。 B.\n    公共汽车即将出发。 C. 道路上挤满了许多汽车。 D. 一名行人正在过马路。\n\n5.  看课本中标记为第5题的图片。 A. 女士正靠着墙。 B.\n    桌子上有一些文件。 C. 女士正在喝一瓶水。 D.\n 近脖子一直疼。 C. 无法辨认。\n\n30. 公交车什么时候来？ A. 它应该马上就到了。 B. 我每周去那里一次。 C.\n    每天这个时候公交车通常都很满。\n\n31. 我可以再要一份这份合同的副本吗？ A. 当然，我再多复印几份。 B.\n    Sam昨晚正试图联系你。（原转写可能有误） C. 没问题，我马上拿给你。\n\n32. 杂货店在哪里？ A. 我们的牛奶快喝完了。 B. 我大约每个月购物一次。 C.\n    就在邮局正对面。\n\n33. 如果我们赢得这份合同，Jones先生会很忙。 A. 我想我们大家都会很忙。 B.\n    你知道我们赢得比赛了吗？ C. 我当时正忙着准备考试。\n\n34. 到工厂需要多长时间？ A. 最多半小时。 B. 从三年前开始。 C.\n    你必须了解事实。\n\n35. 你去咖啡店时能帮我买一个松饼吗？ A. 当然。还要别的吗？ B.\n    我想要一杯浓咖啡。 C. 非常感谢。\n\n36. 你知道去总部的捷径吗？ A. 我的头发剪得太短了。 B.\n    恐怕这就是唯一的路。 C. Park先生是我们团队的新负责人。\n\n37. 你觉得这个月的评估怎么样？ A. 上个月天气非常冷。 B.\n    看来我应该更加努力。 C. 那个水槽堵住了。\n\n38. 你想要这件夹克，还是我给你换一个颜色？ A. 你一定要带上你的夹克。 B.\n    这件事我可以帮你。 C. 你们有哪些颜色？\n\n39. McGuire先生喝加蜂蜜的茶，对吧？ A. 是的，我听说是这样。 B.\n    不，我更喜欢咖啡。 C. 他对酒精过敏。\n\n40. 我得把预约时间往后推。 A. 不要把鞋放在那里。 B.\n    Randall医生星期三有时间。 C. 是的，那场会议被取消了。\n\n第三部分：题目说明\n你会听到两个人之间的一些对话。每段对话后，你需要回答三个关于说话者所说内容的问题。请为每个问题选择最恰当的答案，并在答题卡上标记A、B、C或D。对话只播放一遍，也不会印在课本上。\n\n第41至43题： “用你的右手握住相机机身，左手握住镜头。”\n“好的。画面很模糊。我该怎么对焦？”\n“朝一个方向转动镜头上的调节环，直到你对准的东西看起来清晰为止。如果不行，就试着朝相反方向转动。”\n“好，我弄明白了。真不错。你还能教我什么？” 41. 男士正在教女士什么？ 42.\n女士想做什么？ 43. 女士需要怎么做才能拍出清晰的照片？\n\n第44至46题： “嗨，Jeremy。我听说你要被调派到海外。你对此有什么想法？”\n“是的，公司要派我去巴黎。我将负责国际市场营销部门。这是一次很大的晋升，所以我有些紧张。”\n“真替你高兴。别担心，我觉得你会做得很好的。”\n“我可能两三年内都不会调走。”\n“谁知道呢。至少要让你的主管知道你的想法。祝你好运。” 44.\n说话者在谈论什么？ 45. Jeremy去巴黎后将负责什么工作？ 46.\n女士最有可能是什么身份？\n\n第47至49题：\n“打扰一下。我想不起它叫什么了，但我正在找一种据说能缓解喉咙痛的硬糖。你们有卖吗？”\n“这种糖有很多种，但我不太确定你具体想找哪一种。我们的硬糖都在A3货架。收银台旁边有一些草本润喉糖，不过听起来你要找的既不是薄荷糖，也不是普通的硬糖。”\n“它是最近才上市的。如果你感觉快要感冒了，吃了它就能预防感冒；如果已经感冒了，据说也能让感冒好起来。我前几天在电视上看到了你们的广告。广告里有一个穿红色外套的大个子男人。”\n“哦，那种产品叫……（产品名称无法确认）。我们有柠檬味和樱桃味的，放在5号货架的阿司匹林旁边。”\n47. 这段对话发生在什么场景？ 48. 他们把草本润喉糖放在哪里？ 49.\n他们有哪几种口味？\n\n说明：以上内容依据你发来的 Google Recorder\n自动转写整理。标注“无法确认/不确定”的位置，原始识别文字不清楚，我没有擅自补写。", "pairs": [["Questions 53 through 55. Refer to the following conversation.", "第53至55题。请听下面的对话。"], ["I'm sorry I didn't return your call earlier. I was planning to be back in New York for Christmas, but my flight from Boston was canceled due to the heavy snow.", "抱歉我之前没有及时回你的电话。我原计划圣诞节回纽约，但由于大雪，我从波士顿出发的航班被取消了。"], ["All right. Will I be able to see you before you go back to San Francisco? By the way, I grew up in Boston. What were you doing there?", "好吧。你回旧金山之前，我还能见到你吗？顺便说一下，我是在波士顿长大的。你去那里做什么？"], ["I was in Boston for the flower show. It was not as great as I thought, but it was my first time in Boston. What a beautiful city!", "我去波士顿看花展了。花展没有我想象中那么精彩，不过这是我第一次去波士顿。那真是一座美丽的城市！"], ["I didn't know you were from there. I finally got the flight on the 26th, and I'll be here until New Year's, so let's meet sometime.", "我不知道你来自那里。我终于订到了26日的航班，而且我会在这里待到新年，所以我们找时间见个面吧。"], ["That's great. Then how about the 28th?", "太好了。那28日怎么样？"], ["53. What is the man concerned about?", "53. 男士担心的是什么？"], ["54. Where was the woman on Christmas Day?", "54. 圣诞节当天女士在哪里？"], ["55. What was the woman's impression of Boston?", "55. 女士对波士顿的印象如何？"], ["Questions 56 through 58. Refer to the following conversation.", "第56至58题。请听下面的对话。"], ["Hello, honey. What time does the meeting finish?", "你好，亲爱的。会议几点结束？"], ["You're supposed to finish at 6:00, but we were discussing a new shampoo campaign, so it could take a while.", "本来应该六点结束，但我们正在讨论一个新的洗发水宣传活动，所以可能还要花些时间。"], ["Call me when you're finished. I'll pick you up at your office, and then we can head to dinner. There's a new Italian restaurant I want to try.", "你结束后给我打电话。我去办公室接你，然后我们一起去吃晚饭。有一家新开的意大利餐厅，我想去尝尝。"], ["Now you're making me hungry. I can't wait to see you. See you soon.", "你这么一说，我都饿了。我已经迫不及待想见你了。待会儿见。"], ["56. What is probably the relationship between the man and the woman?", "56. 男女双方最有可能是什么关系？"], ["57. What time will the meeting finish?", "57. 会议几点结束？"], ["58. What are they going to do after the meeting finishes?", "58. 会议结束后他们打算做什么？"], ["Questions 59 through 61. Refer to the following conversation.", "第59至61题。请听下面的对话。"], ["Todd, have you come up with more ideas on how to boost sales of this year's line of living room furniture?", "Todd，你有没有想出更多办法来提高今年这系列客厅家具的销量？"], ["We have already tried the local newspaper and radio. Sponsoring a TV show would be effective, but it costs a lot.", "我们已经尝试过在当地报纸和电台做广告。赞助电视节目可能会有效，但费用很高。"], ["I agree with you. However, it's beyond the entire budget. Let's see. What do you think of the idea of making community flyers?", "我同意。不过，这超出了整个预算。让我想想。你觉得制作社区宣传单这个主意怎么样？"], ["Why couldn't I think of that? It won't cost a lot.", "我怎么就没想到呢？这样花不了多少钱。"], ["59. What are they talking about?", "59. 他们在谈论什么？"], ["60. What do they sell?", "60. 他们卖什么？"], ["61. How will they advertise their product?", "61. 他们将如何为产品做广告？"], ["Questions 62 through 64. Refer to the following conversation.", "第62至64题。请听下面的对话。"], ["Mike, did Mr. Williams call me while I was out of the office this morning?", "Mike，我今天上午不在办公室时，Williams先生给我打电话了吗？"], ["Not that I know of, but Ms. Kevin Harris from Consulting called to confirm our appointment with you for tomorrow morning.", "据我所知没有。不过，来自Kevin Harris咨询公司的女士打电话来，确认了明天上午与你的预约。"], ["Okay, that's fine. I'm leaving soon to attend a seminar for executives at four. If nothing urgent comes up, please contact me on my mobile phone.", "好的，没问题。我马上要出发，去参加四点举行的高管研讨会。如果没有紧急情况，请打我的手机联系我。"], ["Yes. Do you know how long it will take?", "好的。你知道这需要多长时间吗？"], ["62. Who called the woman?", "62. 谁给这位女士打了电话？"], ["63. When will the woman attend the seminar?", "63. 女士什么时候参加研讨会？"], ["64. What does the woman ask the man to do?", "64. 女士要求男士做什么？"], ["Questions 65 through 67. Refer to the following conversation.", "第65至67题。请听下面的对话。"], ["Oh no! I just realized that the comments report is due this Friday morning.", "糟了！我刚意识到评论报告本周五上午就要交了。"], ["Take it easy, Sabina. It's only Tuesday, and you have three days to work on it from today.", "别着急，Sabina。今天才星期二，从今天算起你还有三天时间来完成它。"], ["But I haven't started it yet, and I have many other things to take care of. In addition to that, I have meetings scheduled all day today and tomorrow. What am I supposed to do?", "可是我还没开始写，而且还有很多其他事情要处理。除此之外，我今天和明天一整天都安排了会议。我该怎么办？"], ["Why don't you explain your situation to the supervisor? Maybe you can ask for an extension until Monday.", "你为什么不向主管说明你的情况呢？也许你可以申请延期到星期一。"], ["65. When is the report due?", "65. 报告什么时候截止？"], ["66. What is the woman's problem?", "66. 女士遇到了什么困难？"], ["67. What will the woman probably do next?", "67. 女士接下来最有可能做什么？"], ["Questions 68 through 70. Refer to the following conversation.", "第68至70题。请听下面的对话。"], ["How would you like to pay for this laptop computer?", "这台笔记本电脑你打算如何付款？"], ["By credit card, please. I don't have enough cash with me. What's your return policy?", "请用信用卡付款。我身上带的现金不够。你们的退货政策是什么？"], ["All of our products have a 30-day refund guarantee. This item has a one-year limited warranty, plus we offer an additional two-year extension for an extra 180.", "我们所有产品都有30天退款保证。这件商品有一年的有限保修期，另外加付180元还可以延长两年保修。"], ["Well, 180 is a lot, but I guess it's worth taking it, just in case.", "嗯，180元确实不少，不过我想为了以防万一，还是值得购买的。"], ["68. What are they NOT talking about?", "68. 他们没有谈到什么？"], ["69. What will the woman do next?", "69. 女士接下来会做什么？"], ["70. How long is the product usually guaranteed for?", "70. 这件商品通常有多长的保修期？"], ["PART 4 — DIRECTIONS. You will hear some short talks given by a single speaker. You will be asked to answer three questions about what the speaker says in each short talk. Select the best response and mark A, B, C, or D on your answer sheet. The talks will be spoken only one time and will not be printed in your textbook.", "第四部分：题目说明。你将听到由一位说话者进行的简短讲话。每段讲话后，你需要回答三个有关讲话内容的问题。请选择最恰当的答案，并在答题卡上标记A、B、C或D。每段讲话只播放一遍，也不会印在课本上。"], ["Questions 71 through 73. Refer to the following short talk.", "第71至73题。请听下面的简短讲话。"], ["Thank you all for attending today's meeting. I appreciate the fact that you are very busy, so I understand the sacrifice you have made today to be here.", "感谢大家参加今天的会议。我知道大家都很忙，因此我理解大家今天为了出席会议所作出的时间牺牲。"], ["The reason we asked you here today is to discuss an alarming rise in the incidence of office property theft. This may seem like a minor matter, but every year this problem costs the company more than a million dollars.", "今天请大家来，是为了讨论办公室财物盗窃事件数量惊人地上升这一问题。这看起来或许是小事，但这个问题每年给公司造成的损失超过一百万美元。"], ["Starting tomorrow, we are going to interview everyone in the company to find ways this problem can be solved.", "从明天开始，我们将采访公司里的每一位员工，以寻找解决这一问题的方法。"], ["If you have any suggestions, we would prefer if you could raise them at your one-on-one meeting and not at today's meeting.", "如果你有任何建议，我们希望你在一对一面谈时提出，而不是在今天的会议上提出。"], ["Our security manager, John Bo, will be conducting the interviews and will contact you later in the day to schedule an interview. Thanks for your cooperation.", "我们的安保经理John Bo将负责进行访谈，并会在今天晚些时候联系你，安排访谈时间。感谢大家的配合。"], ["71. What is the purpose of this talk?", "71. 这次讲话的目的是什么？"], ["72. Who is responsible for the interviews?", "72. 谁负责这些访谈？"], ["73. Why are the interviews being conducted?", "73. 为什么要进行这些访谈？"], ["Questions 74 through 76. Refer to the following recorded message.", "第74至76题。请听下面的录音留言。"], ["Mr. Stein, this is Queen from the Paris branch. I'm calling to thank you for your contribution to our recent sales seminar. Your presentation on office ... was excellent, and we would very much appreciate it if you could come and train our staff.", "Stein先生，我是巴黎分部的Queen。我打电话是想感谢你对我们最近销售研讨会所作的贡献。你关于办公室……的演讲非常出色。如果你能来为我们的员工培训，我们将不胜感激。（演讲主题原转写不清）"], ["It would really be an honor if you could join us. We will cover any expenses and offer competitive payment. We are hoping you can see us sometime in the second week of June.", "如果你能加入我们，那将是我们的荣幸。我们会承担所有费用，并提供有竞争力的报酬。我们希望你能在六月第二周找时间来访。"], ["You can contact us either by phone or email. Please let us know as soon as possible.", "你可以通过电话或电子邮件联系我们。请尽快告知我们你的决定。"], ["74. What is the purpose of this message?", "74. 这条留言的目的是什么？"], ["75. What is Mr. Stein's job?", "75. Stein先生从事什么工作？"], ["76. What will Mr. Stein probably do next?", "76. Stein先生接下来最有可能做什么？"], ["Questions 77 through 79. Refer to the following advertisement.", "第77至79题。请听下面的广告。"], ["Whether it's a meal for one or a table for some, food on the run or dinner with your son, the John Street Bistro has you covered.", "无论你是一个人用餐、多人聚餐，想快速吃点东西，还是和儿子共进晚餐，John Street Bistro都能满足你的需求。"], ["We're just around the corner from the fire station, and we are open for breakfast, lunch, and dinner. In fact, we never close.", "我们就在消防站拐角附近，早餐、午餐和晚餐时段都营业。事实上，我们全天24小时营业。"], ["We have all tastes covered. We serve everything from pie to pizza, from soup to sandwiches.", "各种口味我们都能满足。从派到披萨，从汤到三明治，我们应有尽有。"], ["In the month of May, we are celebrating our month of beef, so be sure to check our special board for mouthwatering beef meals.", "五月是我们的牛肉主题月，请务必查看特别菜单板，了解令人垂涎的牛肉料理。"], ["77. Where is the John Street Bistro located?", "77. John Street Bistro位于哪里？"], ["78. What are the restaurant's business hours?", "78. 这家餐厅的营业时间是什么？"], ["79. What is the restaurant's special food in May?", "79. 这家餐厅五月份主推什么食物？"], ["Questions 80 through 82. Refer to the following announcement.", "第80至82题。请听下面的公告。"], ["Attention, Island Ferry passengers. Due to worsening storm conditions, all of today's sailings have been canceled.", "请各位Island Ferry乘客注意。由于风暴天气持续恶化，今天所有航班（渡轮航次）均已取消。"], ["The weather bureau forecasts these bad conditions will last until early next week. Therefore, we ask you not to go to the ferry terminal.", "气象局预报，这种恶劣天气将持续到下周初。因此，请大家不要前往渡轮码头。"], ["For those who are desperate to make it back to the mainland, you're advised that the airport is still open, and Air ... is adding extra flights to its schedule to accommodate stranded passengers.", "对于急需返回大陆的乘客，机场仍然开放，而且航空公司……正在增加航班，以运送滞留乘客。（航空公司名称原转写不清）"], ["We remind passengers that their tickets are non-refundable. We apologize for any inconvenience this may cause, but we also remind you that the weather is beyond our control.", "提醒各位乘客，船票不予退款。对于由此造成的不便，我们深表歉意，但也请大家理解，天气状况并非我们所能控制。"], ["80. Who is the announcement intended for?", "80. 这则公告是面向哪些人的？"], ["81. What is the subject of the announcement?", "81. 这则公告的主题是什么？"], ["82. What is the announcer's suggestion?", "82. 播报者提出了什么建议？"], ["Questions 83 through 85. Refer to the following news report.", "第83至85题。请听下面的新闻报道。"], ["In business news today, Japan's Nico Industries announced plans to expand its manufacturing capacity and build a new factory on the site of the old bus terminal.", "今天的商业新闻：日本Nico Industries宣布计划扩大生产能力，并在旧公交总站原址上建造一座新工厂。"], ["A spokesperson for the company said that the new factory would also serve as the North American distribution center for all Nico products.", "该公司发言人表示，这座新工厂还将作为所有Nico产品在北美的配送中心。"], ["Construction on the massive center is expected to begin early in the new year. Nico anticipates that the construction will require as many as 2,000 workers.", "这座大型中心预计将在新年初开始建设。Nico预计，施工期间最多需要雇用2,000名工人。"], ["Once the factory is operational, it will employ more than 600 full-time workers. This will enhance the area's reputation as a high-tech hub.", "工厂投入运营后，将提供600多个全职岗位。这将进一步提升该地区作为高科技中心的声誉。"], ["83. What is the main topic of this news report?", "83. 这篇新闻报道的主要内容是什么？"], ["84. When will construction start?", "84. 建设工程什么时候开始？"], ["85. What industry is the company in?", "85. 这家公司属于什么行业？"], ["Questions 86 through 88. Refer to the following advertisement.", "第86至88题。请听下面的广告。"], ["Is the increasing cost of currency golf lessons getting beyond what you can afford? Here at Max Golfing School, we believe that everybody should be able to play.", "高尔夫课程费用不断上涨，是否已经超出了你的承受能力？在Max高尔夫学校，我们认为每个人都应该有机会打高尔夫。"], ["During the month of May, we're offering an introductory special. If you sign up for our intensive course, you will receive 20 percent off the usual price, and you will also get a set of beginner's golf clubs.", "五月期间，我们推出入门优惠。如果你报名参加我们的强化课程，就能享受原价八折优惠，还会获赠一套初学者高尔夫球杆。（课程名称和个别词语原转写可能有误）"], ["We have university-trained instructors, all with professional experience. Our courses include 16 rounds of golf and 18 hours at our driving range.", "我们的教练都接受过大学专业训练，并拥有职业经验。课程包括16轮高尔夫球练习，以及在练习场进行的18小时训练。（此处数字依据转写整理）"], ["To sign up, go to www.maxgolf.com and follow the prompts.", "如需报名，请访问www.maxgolf.com并按照网页提示操作。（网址请以原音频为准）"], ["86. What is being advertised?", "86. 这则广告宣传的是什么？"], ["87. Who is the advertisement targeting?", "87. 这则广告的目标受众是谁？"], ["88. How can interested people get more information?", "88. 感兴趣的人如何获取更多信息？"], ["Questions 89 through 91. Refer to the following short talk.", "第89至91题。请听下面的简短讲话。"], ["The last gallery we are going to visit today is the city's newest. You will notice that the construction of this building is unique.", "我们今天要参观的最后一座展览馆是这座城市最新的展览馆。你会注意到，这栋建筑的结构很独特。"], ["This is because this building is the only purpose-built sculpture gallery in the state.", "这是因为它是本州唯一一座专门建造的雕塑展览馆。"], ["Originally, all of the sculptures in this building were kept in the city gardens. However, because of the effects of weather and the danger of damage, the city government decided to build this gallery to house 250 of the world's most important sculptures.", "最初，这里的所有雕塑都收藏在城市花园里。然而，由于天气影响以及作品受损的风险，市政府决定建造这座展览馆，用来收藏世界上250件重要雕塑作品。"], ["Let's make our way inside and see what all the fuss is about.", "我们进去看看，这里究竟有什么特别之处吧。"], ["89. What is the speaker talking about?", "89. 说话者正在谈论什么？"], ["90. Why was the building constructed?", "90. 这栋建筑为什么要建造？"], ["91. How many pieces of artwork are in the building?", "91. 这栋建筑里有多少件艺术品？"], ["Questions 92 through 94. Refer to the following recorded phone message.", "第92至94题。请听下面的电话留言。"], ["Hello, Mr. Jones. This is Matthew White calling to let you know that we have canceled your order for building supplies.", "Jones先生，你好。我是Matthew White。我打电话是想通知你，我们已经取消了你订购的建筑材料订单。"], ["Unfortunately, you have not paid for the last three shipments. Therefore, we see no alternative other than suspending our products and services to you.", "很遗憾，你还没有支付最近三批货物的货款。因此，我们别无选择，只能暂停向你提供产品和服务。"], ["Also, if you do not pay what you owe us, we will be forced to take you to court to recover the money.", "此外，如果你不支付欠款，我们将不得不通过法律途径起诉你，以追回欠款。"], ["We regret having to take such strong action, but we see no better way to deal with the situation.", "我们很遗憾不得不采取如此强硬的措施，但我们认为没有更好的办法来处理这种情况。"], ["92. What is the subject of this message?", "92. 这条留言的主题是什么？"], ["93. What can we infer about the sort of work Mr. Jones does?", "93. 我们可以推断Jones先生从事哪一类工作？"], ["94. What will happen if the matter is not resolved?", "94. 如果问题得不到解决，会发生什么？"], ["Questions 95 through 97. Refer to the following notice.", "第95至97题。请听下面的通知。"], ["You've probably noticed the stains on the ceiling and a strong smell coming from the bathrooms. This is because of the problem we have had with the pipes in this building.", "你可能已经注意到天花板上的污渍，以及从洗手间传出的强烈气味。这是因为这栋楼的管道出现了问题。"], ["Repair people will be coming in on Monday to fix the problem. While they are here, we may have to vacate the building for safety reasons.", "维修人员将于星期一到这里解决问题。维修期间，出于安全考虑，我们可能需要暂时撤离这栋楼。"], ["This means those of you who can will be asked to work from home. Those who cannot work from home will be transferred to our office on the other side of the city.", "这意味着能够在家办公的人将被要求居家工作。无法居家办公的人将被安排到城市另一边的办公室工作。"], ["The work should take about two days to complete. We apologize for any inconvenience this may cause.", "维修工作预计需要两天左右完成。对于由此造成的不便，我们深表歉意。"], ["95. What kind of work needs to be done?", "95. 需要进行哪种维修工作？"], ["96. When will the work commence?", "96. 维修工作什么时候开始？"], ["97. What will workers have to do?", "97. 员工需要做什么？"], ["Questions 98 through 100. Refer to the following advertisement.", "第98至100题。请听下面的广告。"], ["Open to the public: A History of Eastern Furniture. This is the first time this exhibition has come to our city.", "向公众开放：《东方家具史》展览。这是该展览首次来到我们这座城市。"], ["The depth of the collection will amaze both history buffs and furniture lovers. The exhibition features traditional furnishings from China, Japan, and Korea.", "丰富的藏品将令历史爱好者和家具爱好者大开眼界。展览展出了来自中国、日本和韩国的传统家具。"], ["The City Bank and the governments of China, Japan, and Korea are sponsoring the exhibition.", "City Bank以及中国、日本和韩国政府为本次展览提供赞助。"], ["We also want to thank the East West for their help in finding the very best volunteer guides for the exhibition. Our catalog of the exhibits can be ordered at www....", "我们还要感谢East West，他们帮助我们为展览找到了最优秀的志愿讲解员。展品目录可以通过www……订购。（网址原转写不完整）"], ["98. What is displayed in the exhibition?", "98. 展览中展出了什么？"], ["99. Which of the following countries is NOT featured in the exhibition?", "99. 以下哪个国家没有出现在展览中？"], ["100. What did the East West do for the exhibit?", "100. East West为这次展览做了什么？"]]};
let current=0, allOpen=false, deferredInstallPrompt=null;
const names=["Lesson 1 · TOEIC Listening Test 1","Lesson 2 · 待添加","Lesson 3 · 待添加","Lesson 4 · 待添加","Lesson 5 · 待添加","Lesson 6 · 待添加","Lesson 7 · 待添加"];
function init(){const list=document.getElementById('lessonList');names.forEach((n,i)=>{let b=document.createElement('button');b.className='lesson card';b.innerHTML='<span>'+n+'<small>'+(i===0?'已整理 · 点击进入':'尚未添加文字稿')+'</small></span><b>'+(i===0?'打开 →':'待添加')+'</b>';b.disabled=false;b.onclick=()=>openLesson(i);list.appendChild(b);});}
function home(){document.getElementById('homeView').classList.remove('hidden');document.getElementById('lessonView').classList.add('hidden');document.getElementById('headTitle').textContent='TOEIC 听力学习';window.scrollTo(0,0);}
function openLesson(i){current=i;document.getElementById('homeView').classList.add('hidden');document.getElementById('lessonView').classList.remove('hidden');document.getElementById('headTitle').textContent='Lesson 1';document.getElementById('lessonTitle').textContent=names[i];render();window.scrollTo(0,0);}
function addSection(parent,title){let s=document.createElement('div');s.className='section';s.textContent=title;parent.appendChild(s);}
function addLine(parent,en,zh){let d=document.createElement('div');d.className='line';let a=document.createElement('div');a.className='en';a.textContent=en;let b=document.createElement('div');b.className='zh';b.textContent=zh;d.append(a,b);d.onclick=()=>d.classList.toggle('open');parent.appendChild(d);}
function render(){let c=document.getElementById('lessonContent');c.innerHTML='';
if(current!==0){let msg=document.createElement('div');msg.className='card';msg.innerHTML='<h3>本课文字稿尚未添加</h3><p>这里是 '+names[current]+' 的学习页面。收到这一课的英文转写后，就可以加入逐句点击显示中文的内容。</p>';c.appendChild(msg);document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===6;return;}
addSection(c,'第一部分 · 前半段（第1–49题）');
let old=document.createElement('div');old.className='card';
let btn=document.createElement('button');btn.className='action';btn.textContent='显示 / 隐藏前半段英文原文';let en=document.createElement('div');en.className='hidden';en.style.whiteSpace='pre-wrap';en.style.marginTop='12px';en.textContent=D.oldEnglish;
let btn2=document.createElement('button');btn2.className='action';btn2.textContent='显示 / 隐藏前半段中文翻译';let zh=document.createElement('div');zh.className='hidden';zh.style.whiteSpace='pre-wrap';zh.style.marginTop='12px';zh.textContent=D.oldChinese;
btn.onclick=()=>en.classList.toggle('hidden');btn2.onclick=()=>zh.classList.toggle('hidden');old.append(btn,btn2,en,zh);c.appendChild(old);
addSection(c,'第二部分 · 后半段（第53–100题）');
D.pairs.forEach(([e,z])=>{if(/^PART 4/.test(e))addSection(c,'第四部分 · 短文理解');else if(/^Questions /.test(e))addSection(c,e);addLine(c,e,z);});
document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===6;
}
function toggleAll(){allOpen=!allOpen;document.querySelectorAll('#lessonContent .line').forEach(x=>x.classList.toggle('open',allOpen));}
function collapseAll(){allOpen=false;document.querySelectorAll('#lessonContent .line').forEach(x=>x.classList.remove('open'));}
function move(dir){let n=current+dir;if(n>=0&&n<7){current=n;document.getElementById('headTitle').textContent='Lesson '+(n+1);document.getElementById('lessonTitle').textContent=names[n];render();window.scrollTo(0,0);}}
init();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  document.getElementById('installBtn').classList.remove('hidden');
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  document.getElementById('installBtn').classList.add('hidden');
}
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBtn').classList.add('hidden');
});
</script></body></html>
